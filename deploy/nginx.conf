events {}

http {
    upstream surge_api {
        server api:8000;   # resolves to every replica when scaled
        keepalive 64;
    }

    server {
        listen 80;

        # Internal only: unauthenticated admin endpoints and raw metrics.
        location ^~ /admin   { return 404; }
        location ^~ /metrics { return 404; }

        location / {
            proxy_pass http://surge_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}